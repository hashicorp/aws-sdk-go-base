version: "2"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt

linters:
  default: none
  enable:
    - copyloopvar
    - dogsled
    - errcheck
    - errname
    - goconst
    - govet
    - ineffassign
    - misspell
    - mnd
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usetesting
    - whitespace
  exclusions:
    rules:
      - path: configtesting
        linters:
          - goconst
      - path: internal/test
        linters:
          - goconst
      - path: servicemocks
        linters:
          - goconst
      - linters:
          - staticcheck
        text: "SA1019: aws.Endpoint is deprecated"
      - linters:
          - staticcheck
        text: "SA1019: aws.EndpointResolverWithOptions is deprecated"
      - linters:
          - staticcheck
        text: "SA1019: aws.EndpointResolverWithOptionsFunc is deprecated"
      - linters:
          - staticcheck
        text: "SA1019: config.WithEndpointResolverWithOptions is deprecated"
      - linters:
          - staticcheck
        text: "SA1019: .+ is deprecated: aws-sdk-go is deprecated"
  settings:
    copyloopvar:
      check-alias: true
    goconst:
      ignore-tests: true
    mnd:
      ignored-functions:
        - strings.SplitN
        - strings.SplitAfterN
        - os.MkdirAll
    usetesting:
      os-create-temp: false
      os-mkdir-temp: false
      os-setenv: false
